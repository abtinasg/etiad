<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">لوگوی کلینیک خورشید</title>
  <desc id="desc">نماد مینیمال طلوع خورشید، مسیر و فرم‌های حمایتی سبز</desc>

  <!-- Sun rays -->
  <g stroke="#C89B4B" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="58" x2="256" y2="94"/>
    <line x1="199" y1="73" x2="214" y2="106"/>
    <line x1="313" y1="73" x2="298" y2="106"/>
    <line x1="151" y1="108" x2="178" y2="132"/>
    <line x1="361" y1="108" x2="334" y2="132"/>
    <line x1="120" y1="157" x2="153" y2="171"/>
    <line x1="392" y1="157" x2="359" y2="171"/>
  </g>

  <!-- Rising sun -->
  <path d="M194 189a62 62 0 0 1 124 0v8H194z" fill="#C89B4B"/>

  <!-- Soft hills -->
  <path d="M92 218c72-25 133-13 184 24-44 24-82 62-111 111-45-24-68-71-73-135z"
        fill="#DDECE7"/>
  <path d="M420 218c-72-25-133-13-184 24 44 24 82 62 111 111 45-24 68-71 73-135z"
