  <!-- Protective outer forms -->
  <path d="M102 205c-12 70 2 136 47 190 31 38 70 60 107 67-54-34-88-79-101-131-10-40-8-81 5-118-22 11-42 24-58 38z"
        fill="#174C45"/>
  <path d="M410 205c12 70-2 136-47 190-31 38-70 60-107 67 54-34 88-79 101-131 10-40 8-81-5-118 22 11 42 24 58 38z"
        fill="#174C45"/>

  <!-- White path / recovery route -->
  <path d="M256 458c-18-41-42-76-75-102 14-34 40-66 77-91 21-15 39-31 55-49-5 35-20 64-48 87-20 17-33 33-39 49 25 22 43 57 51 106z"
        fill="#FFFFFF"/>

  <!-- Inner leaf cuts -->
  <path d="M126 292c27 8 48 23 66 46-19-5-38-2-58 10-10-18-13-37-8-56z" fill="#FAFAF7"/>
  <path d="M386 292c-27 8-48 23-66 46 19-5 38-2 58 10 10-18 13-37 8-56z" fill="#FAFAF7"/>
</svg>
